%YAML:1.0
# HA01 contract fixture. Distances are control-image pixels. The numeric limits
# are experimental and are not a confirmed product standard. Legacy keeps the
# old diagnostic chase. human_led must not chase a large offset.
scenarios:
  - {id: "legacy-offset", motion: "constant", frames: 30, start_x: 200., start_y: 240., vx: 0., vy: 0., noise_px: 0., pid_kp: 2., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, assist_mode: "legacy"}
  - {id: "human-led-offset", motion: "constant", frames: 30, start_x: 200., start_y: 240., vx: 0., vy: 0., noise_px: 0., pid_kp: 2., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, assist_mode: "human_led", assist_center_x: 320., assist_center_y: 240., assist_enter_px: 48., assist_exit_px: 72., assist_deadzone_px: 1., assist_max_step_px: 2., assist_max_speed_px_s: 50., assist_max_accel_px_s2: 500., human_turn_px: 12., assist_resume_wait_s: 0.2, human_camera: [{t_ns: 0, dx_px: 40., dy_px: 0., takeover: 1}]}
