%YAML:1.0
# HA05 human-led scoring fixture. Distances are control-image pixels.
# Enter 48, exit 72, deadzone 1, step 2, speed 50, acceleration 500 and the
# 0.2 s resume wait are experimental, not a confirmed product standard.
# Tune them here, or share one copy through assist_defaults as in the HA06 configs.
# The independent auditor recomputes eligibility. The old SUCCESS latch is not
# this protocol: outside the region, zero assist is a pass.
scenarios:
  - {id: "inside-x", motion: "constant", frames: 60, start_x: 340., start_y: 240., vx: 0., vy: 0., noise_px: 0., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1, assist_mode: "human_led", assist_center_x: 320., assist_center_y: 240., assist_enter_px: 48., assist_exit_px: 72., assist_deadzone_px: 1., assist_max_step_px: 2., assist_max_speed_px_s: 50., assist_max_accel_px_s2: 500., human_turn_px: 12., assist_resume_wait_s: 0.2}
  - {id: "inside-y", motion: "constant", frames: 60, start_x: 320., start_y: 260., vx: 0., vy: 0., noise_px: 0., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1, assist_mode: "human_led", assist_center_x: 320., assist_center_y: 240., assist_enter_px: 48., assist_exit_px: 72., assist_deadzone_px: 1., assist_max_step_px: 2., assist_max_speed_px_s: 50., assist_max_accel_px_s2: 500., human_turn_px: 12., assist_resume_wait_s: 0.2}
  - {id: "inside-diagonal", motion: "constant", frames: 60, start_x: 332., start_y: 252., vx: 0., vy: 0., noise_px: 0., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1, assist_mode: "human_led", assist_center_x: 320., assist_center_y: 240., assist_enter_px: 48., assist_exit_px: 72., assist_deadzone_px: 1., assist_max_step_px: 2., assist_max_speed_px_s: 50., assist_max_accel_px_s2: 500., human_turn_px: 12., assist_resume_wait_s: 0.2}
  - {id: "outside", motion: "constant", frames: 40, start_x: 120., start_y: 240., vx: 0., vy: 0., noise_px: 0., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1, assist_mode: "human_led", assist_center_x: 320., assist_center_y: 240., assist_enter_px: 48., assist_exit_px: 72., assist_deadzone_px: 1., assist_max_step_px: 2., assist_max_speed_px_s: 50., assist_max_accel_px_s2: 500., human_turn_px: 12., assist_resume_wait_s: 0.2}
  - {id: "between-enter-exit", motion: "constant", frames: 40, start_x: 380., start_y: 240., vx: 0., vy: 0., noise_px: 0., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1, assist_mode: "human_led", assist_center_x: 320., assist_center_y: 240., assist_enter_px: 48., assist_exit_px: 72., assist_deadzone_px: 1., assist_max_step_px: 2., assist_max_speed_px_s: 50., assist_max_accel_px_s2: 500., human_turn_px: 12., assist_resume_wait_s: 0.2}
  - {id: "held-takeover", motion: "constant", frames: 60, start_x: 340., start_y: 240., vx: 0., vy: 0., noise_px: 0., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1, assist_mode: "human_led", assist_center_x: 320., assist_center_y: 240., assist_enter_px: 48., assist_exit_px: 72., assist_deadzone_px: 1., assist_max_step_px: 2., assist_max_speed_px_s: 50., assist_max_accel_px_s2: 500., human_turn_px: 12., assist_resume_wait_s: 0.2, human_camera: [{t_ns: 400000000, dx_px: 0., dy_px: 0., takeover: 1}]}
  - {id: "release-resume", motion: "constant", frames: 90, start_x: 340., start_y: 240., vx: 0., vy: 0., noise_px: 0., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1, assist_mode: "human_led", assist_center_x: 320., assist_center_y: 240., assist_enter_px: 48., assist_exit_px: 72., assist_deadzone_px: 1., assist_max_step_px: 2., assist_max_speed_px_s: 50., assist_max_accel_px_s2: 500., human_turn_px: 12., assist_resume_wait_s: 0.2, human_camera: [{t_ns: 400000000, dx_px: 0., dy_px: 0., takeover: 1}, {t_ns: 800000000, dx_px: 0., dy_px: 0., takeover: 0}]}
