%YAML:1.0
# HA06 delay and fault cases. UNKNOWN and FAILED are results, not omissions.
# The delay pair shares one human sample. Limits in assist_defaults are experimental.
assist_defaults:
  assist_mode: "human_led"
  assist_enabled: 1
  assist_center_x: 320.
  assist_center_y: 240.
  assist_enter_px: 48.
  assist_exit_px: 72.
  assist_deadzone_px: 1.
  assist_max_step_px: 2.
  assist_max_speed_px_s: 50.
  assist_max_accel_px_s2: 500.
  human_turn_px: 12.
  assist_resume_wait_s: 0.2
scenarios:
  - {id: "delay-0", motion: "constant", frames: 60, start_x: 340., start_y: 240., vx: 0., vy: 0., noise_px: 0., observation_delay_ms: 0., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1, human_camera: [{t_ns: 0, dx_px: 8., dy_px: 0., takeover: 0}]}
  - {id: "delay-80", motion: "constant", frames: 60, start_x: 340., start_y: 240., vx: 0., vy: 0., noise_px: 0., observation_delay_ms: 80., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1, human_camera: [{t_ns: 0, dx_px: 8., dy_px: 0., takeover: 0}]}
  - {id: "dispatch-fail", motion: "constant", frames: 80, start_x: 340., start_y: 240., vx: 0., vy: 0., noise_px: 0., dispatch_failure_rate: 1., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1}
  - {id: "feedback-drop", motion: "constant", frames: 80, start_x: 340., start_y: 240., vx: 0., vy: 0., noise_px: 0., feedback_drop_rate: 1., feedback_timeout_ms: 200., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1}
  - {id: "encoder-drop", motion: "constant", frames: 40, start_x: 340., start_y: 240., vx: 0., vy: 0., noise_px: 0., encoder_transport: 1, encoder_drop_rate: 1., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1}
