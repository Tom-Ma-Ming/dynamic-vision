%YAML:1.0
# Commands while device execution is hidden from the controller. Feedback delay
# is longer than the run, so applied events are not delivered. Fixed review
# configs are not modified here.
scenarios:
  - {id: "undelivered-feedforward", motion: "constant", frames: 8, start_x: 160., start_y: 240., vx: 80., vy: 0., noise_px: 0., pid_kp: 2., command_horizon_s: 0., incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1, encoder_transport: 1, encoder_extrapolation: 1, velocity_feedforward: 1, encoder_delay_ms: 80., encoder_delay_compensation: 1, feedback_transport: 1, feedback_delay_ms: 500., feedback_jitter_ms: 0., feedback_timeout_ms: 2000., success_after_frame: 0}
