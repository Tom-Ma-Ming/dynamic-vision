%YAML:1.0
# HA06 rendered closed loop. image_detector pixel builds a colored sprite and
# feeds its box back as a detection. This is not a TensorRT or YOLO execution.
# The TensorRT command is vision_sim_image ... human_led, recorded by run_ha06.py.
# Region, deadzone, step and resume wait are experimental.
assist_defaults:
  assist_mode: "human_led"
  assist_center_x: 160.
  assist_center_y: 160.
  assist_enter_px: 48.
  assist_exit_px: 72.
  assist_deadzone_px: 1.
  assist_max_step_px: 2.
  assist_max_speed_px_s: 50.
  assist_max_accel_px_s2: 500.
  human_turn_px: 12.
  assist_resume_wait_s: 0.2
scenarios:
  - {id: "pixel-on", motion: "constant", frames: 40, width: 320, height: 320, start_x: 180., start_y: 160., vx: 0., vy: 0., noise_px: 0., target_w: 24., target_h: 48., actuator_delay_frames: 0, image_detector: "pixel", assist_enabled: 1, incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1}
  - {id: "pixel-off", motion: "constant", frames: 40, width: 320, height: 320, start_x: 180., start_y: 160., vx: 0., vy: 0., noise_px: 0., target_w: 24., target_h: 48., actuator_delay_frames: 0, image_detector: "pixel", assist_enabled: 0, incremental_control: 1, acquire_single_confirmed: 1, view_feedback: 1, encoder_compensation: 1}
