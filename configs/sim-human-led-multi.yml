%YAML:1.0
# HA06 two-person scenes. The selector stays on track 1. The distractor is a
# second synthetic person, not a ReID model. ReID stays deferred.
# Region, deadzone, step and resume wait below are experimental.
assist_defaults:
  assist_mode: "human_led"
  assist_enabled: 1
  assist_center_x: 320.
  assist_center_y: 240.
  assist_enter_px: 48.
  assist_exit_px: 72.
  assist_deadzone_px: 1.
  assist_max_step_px: 2.
  assist_max_speed_px_s: 50.
  assist_max_accel_px_s2: 500.
  human_turn_px: 12.
  assist_resume_wait_s: 0.2
scenarios:
  - {id: "separated", motion: "constant", frames: 50, start_x: 340., start_y: 240., vx: 0., vy: 0., noise_px: 0., incremental_control: 1, acquire_single_confirmed: 0, selected_track_id: 1, view_feedback: 1, encoder_compensation: 1, distractor: 1, distractor_x: 80., distractor_y: 400., distractor_vx: 0., distractor_vy: 0.}
  - {id: "cross", motion: "constant", frames: 70, start_x: 336., start_y: 240., vx: 0., vy: 0., noise_px: 0., incremental_control: 1, acquire_single_confirmed: 0, selected_track_id: 1, view_feedback: 1, encoder_compensation: 1, distractor: 1, distractor_x: 180., distractor_y: 240., distractor_vx: 120., distractor_vy: 0.}
