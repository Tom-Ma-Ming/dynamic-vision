name: Build and test
on: [push, pull_request]
jobs:
  windows-probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B out/ci -A x64 -DVISION_PROBE_ONLY=ON
      - run: cmake --build out/ci --config Release
      - run: ctest --test-dir out/ci -C Release --output-on-failure
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/tools -q
      - run: cmake -S . -B out/ci -DVISION_WITH_TRT=OFF -DVISION_WITH_OPENCV=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build out/ci --parallel 2
      - run: ctest --test-dir out/ci --output-on-failure
